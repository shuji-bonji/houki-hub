name: Stack version check

# stack.json / README の構成表が npm の公開版とずれていないかを毎日照合し、
# ずれていれば houki-hub 自身に Issue「stack.json の版が npm と違う」（ラベル stack-drift）を立てる。
# 同じ Issue が open のままなら本文を差し替え、ずれの中身が変わったときだけコメントする。
# ずれが解消したら、その Issue を閉じる。npm に届かなかったときは Issue に触らず exit 2 で終わる。
# Issue の本文には、別の節に、現行版で確かめていない呼び出し例（scripts/check-example-versions.mjs）の一覧も載せる。
# （houki-hub#5 の①③。経緯は docs/notes/2026-10-01-hub5-change-detection.md）
#
# 直すのは手元で: node scripts/generate-stack.mjs --readme → commit → push（push で再検査し、Issue が閉じる）

on:
  schedule:
    - cron: '17 22 * * *' # 毎日 07:17 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stack.json'
      - 'README.md'
      - 'scripts/generate-stack.mjs'
      - 'scripts/check-example-versions.mjs'
      - 'scripts/reference-examples/**'
      - '.github/scripts/**'
      - '.github/workflows/stack-check.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: stack-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 依存なし（npm registry と GitHub API を fetch で読むだけ）。install 不要
      - name: 判定と本文のテスト
        run: node --test '.github/scripts/*.test.mjs' 'scripts/*.test.mjs'
      - name: npm と照合して Issue を同期
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/stack-drift-issue.mjs
