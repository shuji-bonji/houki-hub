name: Reference regeneration (prototype)

# リファレンス（site/docs/reference/）と仕様書ページ（site/docs/specs/）を、各リポジトリの公開版から作り直す。
# 差分があれば PR（ブランチ bot/reference-regen）を開くか、開いている PR を更新する。
# あわせて、作り直す前のサイトの生成ページの版と公開版のずれ（scripts/check-site-versions.mjs）を PR の本文と実行の要約に出す。
# （houki-hub#5 ②。設計は docs/notes/2026-10-10-design-hub5-regen-and-examples-check.md）
#
# 入力の取り方（.github/scripts/prepare-sources.mjs）:
#   - 版: npm の latest（npm に無い Skill は最新のタグ）
#   - specs/・Skill の workflows/・MCP の src/: 各リポジトリをその版のタグで浅く clone
#   - MCP の tools/list: npx -y <npm>@<版>（clone は build しない）
#   - houki-abbreviations の .d.ts: 公開した tarball の dist/ を clone に重ねる
#
# 試作のあいだは workflow_dispatch だけで動かす。schedule と push のトリガーは、shuji が試作を見てから足す。
# 既定（open_pr: false）は PR を開かず、差分の一覧を実行の要約に出し、差分を artifact に置くだけ。
# PR を開くには、Settings → Actions → General の「Allow GitHub Actions to create and approve pull requests」を有効にしておく必要がある。

on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: '差分があれば PR を開く・更新する（false なら要約と artifact だけ）'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reference-regen
  cancel-in-progress: false

env:
  BRANCH: bot/reference-regen

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 依存なし（生成スクリプトは site の npm ci を要らない。typescript と spec-ids は prepare-sources.mjs が入れる）
      - name: 判定と本文のテスト
        run: node --test '.github/scripts/*.test.mjs' 'scripts/*.test.mjs'

      - name: 公開版を決めて、各リポジトリを clone する
        run: |
          echo "SOURCES=$RUNNER_TEMP/houki-sources" >> "$GITHUB_ENV"
          node .github/scripts/prepare-sources.mjs --out "$RUNNER_TEMP/houki-sources"
        # HOUKI_SOURCE_DIR・HOUKI_MCP_LAUNCH=npx・HOUKI_MCP_VERSIONS を GITHUB_ENV に書く

      - name: 作り直す前のサイトの版と公開版を比べる
        run: node scripts/check-site-versions.mjs --versions "$SOURCES/versions.json" | tee "$RUNNER_TEMP/site-versions.md"

      - name: リファレンスと仕様書ページを作り直す
        run: node scripts/generate-reference.mjs 2>&1 | tee "$RUNNER_TEMP/generate.log"

      - name: 差分をまとめる
        id: diff
        run: |
          git add -N site/docs
          git diff --stat -- site/docs > "$RUNNER_TEMP/diffstat.txt"
          git diff -- site/docs > "$RUNNER_TEMP/regen.diff"
          if [ -s "$RUNNER_TEMP/regen.diff" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          node -e '
            const v = require(process.argv[1]);
            const rows = v.repos.map((r) => `| ${r.repo} | ${r.version ? `v${r.version}` : "（決められない）"} | ${r.npmLatest ?? "—"} | ${r.latestTag ?? "—"} | ${r.note ?? ""} |`);
            console.log(["| リポジトリ | 作った版 | npm の latest | 最新のタグ | 注記 |", "| --- | --- | --- | --- | --- |", ...rows].join("\n"));
          ' "$SOURCES/versions.json" > "$RUNNER_TEMP/versions.md"
          {
            echo "公開版から作り直した結果です。\`.github/workflows/reference-regen.yml\` が $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST に実行しました（[実行ログ](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})）。"
            echo
            echo "## 作った版"
            echo
            cat "$RUNNER_TEMP/versions.md"
            echo
            echo "## 作り直す前のサイトの版"
            echo
            sed '1,2d' "$RUNNER_TEMP/site-versions.md"
            echo
            echo "## 変わったページ"
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/diffstat.txt"
            echo '```'
            echo
            echo "## マージの前に確かめること"
            echo
            echo "- 冒頭の版が同じでも中身が変わったページは、公開していない作業コピーから作られていた可能性があります（例: 仕様書ページの「承認の履歴」が消える）。その版を公開するまでマージを待つかを決めてください"
            echo "- 呼び出し例（\`scripts/reference-examples/\`）はこの PR では変えません。応答の照合は \`node scripts/check-examples-contract.mjs\` を Mac で回します（houki-hub#44）"
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: 差分を artifact に置く
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reference-regen
          path: |
            ${{ runner.temp }}/regen.diff
            ${{ runner.temp }}/generate.log
            ${{ runner.temp }}/pr-body.md

      - name: PR を開く・更新する
        if: steps.diff.outputs.changed == 'true' && inputs.open_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add site/docs
          git commit -q -m "docs(site): 公開版からリファレンスと仕様書ページを作り直す" -m "reference-regen.yml の実行 ${GITHUB_RUN_ID} が作った（houki-hub#5 ②）。"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "PR #$number を更新しました" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base main --head "$BRANCH" --title 'リファレンスと仕様書ページを公開版から作り直す' --body-file "$RUNNER_TEMP/pr-body.md"
          fi
