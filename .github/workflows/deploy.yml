name: Deploy site to GitHub Pages

# **ワークフローはリポジトリルートの .github/ にしか置けない。**
# site/ 配下に置くと GitHub はそれを見ない（pdf-agent-stack で 2026-07-29 に踏んだ）。
# ビルド対象だけ site/ に向ける。
#
# 公開前の運用（2026-09-07〜）:
#   push では走らせない。手動起動（workflow_dispatch）だけにしてある。
#   公開に切り替えるときは、下の on.push のコメントを外し、
#   GitHub の Settings → Pages → Source を "GitHub Actions" にする。

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'site/**'
  #     - 'scripts/**'
  #     - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # ロックファイルがルートに無いので明示する（無いとキャッシュが黙って効かない）
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          # **action の input は working-directory の影響を受けない。**
          # ここだけリポジトリルートからの相対で書く
          path: site/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
